<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <div class=" calculator">
    <div class="error"></div>
    <div class="display-wraper"><span class="display">0</span></div>
    <div class="buttons">
        <button class="clear">AC</button>
        <button>%</button>
        <button class="backspace"><span class="material-symbols-outlined">backspace</span></button>
        <button>/</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>x</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
        <button><span class="material-symbols-outlined">history</span></button>
        <button>0</button>
        <button>.</button>
        <button class="equal">=</button>
    </div>
    </div>
    <script src="index.js"></script>
    </body>

</html>
